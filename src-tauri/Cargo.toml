[package]
name = "oxide-studio"
version = "0.1.13"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "oxide-studio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oxide_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-prost-build = "0.14.6"

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "rustls-tls"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database support
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "mysql",
    "sqlite",
    "any",
    "chrono",
    "uuid",
    "bigdecimal"
] }

# Error handling
anyhow = "1"
thiserror = "2"
async-trait = "0.1.89"
tree-sitter = "0.21"
tree-sitter-sql = { package = "devgen-tree-sitter-sql", version = "0.21.0" }
tree-sitter-bash = "0.21.0"
regex = "1"
semver = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
flate2 = "1.0"
tar = "0.4"
redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager"] }
mongodb = "3.7.0"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
url = "2.5"
percent-encoding = "2.3"
sha2 = "0.10"
rustls-pemfile = "2.2"
hmac = "0.12"
minisign-verify = "0.2.5"
tempfile = "3"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
libc = "0.2"
zeroize = "1"
keyring = { version = "=4.1.5", default-features = true }
oxide-enterprise-contracts = { path = "../enterprise/contracts", default-features = false }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["transport", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
sqlparser = { version = "0.59.0", features = ["visitor"] }
csv = "1.3"
calamine = "0.26"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
arrow-ipc = "59.2.0"
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap"] }
chrono = "0.4"
clap = { version = "=4.6.1", features = ["derive", "env"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io"] }
oxide-driver-protocol = { path = "crates/oxide-driver-protocol" }

[dev-dependencies]
dotenvy = "0.15.7"

# LSP support
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1.0"
tar = "0.4"
