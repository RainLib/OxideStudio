[package]
name = "oxide-studio"
version = "0.1.18"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "oxide-studio"

[[bin]]
name = "oxide-studio"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "oxide-agent"
path = "src/bin/oxide-agent.rs"

[[test]]
name = "backup_worker"
path = "tests/backup_worker.rs"
required-features = ["desktop"]

[[test]]
name = "live_database"
path = "tests/live_database.rs"
required-features = ["desktop"]

# Explicit, isolated real-WebView acceptance. Ordinary cargo test only prints
# its opt-in instructions; it never opens a window or touches a user profile.
[[test]]
name = "desktop_import_ipc"
path = "tests/desktop_import_ipc/main.rs"
harness = false
required-features = ["desktop"]

[[test]]
name = "desktop_lsp_ipc"
path = "tests/desktop_lsp_ipc/main.rs"
harness = false
required-features = ["desktop"]

[[test]]
name = "desktop_file_query_ipc"
path = "tests/desktop_file_query_ipc/main.rs"
harness = false
required-features = ["desktop"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oxide_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
    "dep:cc",
    "dep:jiff",
    "dep:keyring",
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-updater",
    "dep:tauri-build",
    "dep:tonic-prost-build",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
tonic-prost-build = { version = "0.14.6", optional = true }
cc = { version = "1", optional = true }
sha2 = "0.10"

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "rustls-tls"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database support
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "mysql",
    "sqlite",
    "any",
    "chrono",
    "uuid",
    "bigdecimal"
] }
# Keep this pinned to SQLx 0.8.6's semver-exempt SQLite handle dependency.
# The native online-backup API is used only while SQLx's LockedSqliteHandle
# owns both connections.
libsqlite3-sys = "=0.30.1"

# Error handling
anyhow = "1"
thiserror = "2"
async-trait = "0.1.89"
tree-sitter = "0.21"
tree-sitter-sql = { package = "devgen-tree-sitter-sql", version = "0.21.0" }
tree-sitter-bash = "0.21.0"
regex = "1"
semver = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
flate2 = "1.0"
tar = "0.4"

redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager"] }
mongodb = "3.7.0"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
url = "2.5"
percent-encoding = "2.3"
sha2 = "0.10"
rustls-pemfile = "2.2"
hmac = "0.12"
minisign-verify = "0.2.5"
tempfile = "3"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
libc = "0.2"
zeroize = "1"
keyring = { version = "=4.1.5", default-features = true, optional = true }
oxide-enterprise-contracts = { path = "../enterprise/contracts", default-features = false }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["transport", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
sqlparser = { version = "0.59.0", features = ["visitor"] }
csv = "1.3"
encoding_rs = "0.8"
calamine = "0.26"
quick-xml = { version = "0.31.0", features = ["encoding"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
arrow-ipc = "59.2.0"
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap"] }
chrono = "0.4"
jiff = { version = "0.2.38", optional = true }
clap = { version = "=4.6.1", features = ["derive", "env"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

oxide-driver-protocol = { path = "crates/oxide-driver-protocol" }
oxide-sqlite-worker = { path = "crates/oxide-sqlite-worker", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
dotenvy = "0.15.7"
tower = { version = "0.5", features = ["util"] }

# LSP support
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1.0"
tar = "0.4"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus"] }

# Backport the upstream Windows ShellExecuteW failure check until the next
# dependency upgrade; see crates/tauri-plugin-updater/OXIDE_PATCH.md.
[patch.crates-io]
tauri-plugin-updater = { path = "crates/tauri-plugin-updater" }
