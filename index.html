<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/oxide-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OxideStudio</title>
    <style>
        html,
        body {
            background-color: #131313;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* Prevent scrolling during load */
        }
    </style>
</head>

<body>
    <div id="root">
        <!-- Static Loading State -->
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #09090b;
                /* Zinc-950 */
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                overflow: hidden;
            }

            #app-loader {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #09090b;
                z-index: 9999;
                transition: opacity 0.5s ease-out;
            }

            .loader-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 24px;
                position: relative;
            }

            .logo-container {
                position: relative;
                width: 72px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: center;
                animation: breath 3s infinite ease-in-out;
            }

            .logo-image {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .loader-text {
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.2em;
                color: rgba(255, 255, 255, 0.8);
                text-transform: uppercase;
                animation: fade-in-up 0.8s ease-out;
            }

            .loader-bar-bg {
                width: 140px;
                height: 2px;
                background-color: rgba(255, 255, 255, 0.1);
                border-radius: 4px;
                overflow: hidden;
                margin-top: 8px;
            }

            .loader-bar-fill {
                width: 50%;
                height: 100%;
                background-color: #ea580c;
                border-radius: 4px;
                animation: shimmer 1.5s infinite linear;
                transform-origin: left;
            }

            .loader-error {
                display: none;
                max-width: 420px;
                color: rgba(255, 255, 255, 0.62);
                font-size: 12px;
                line-height: 1.6;
                text-align: center;
                word-break: break-word;
            }

            .loader-retry {
                display: none;
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 6px;
                padding: 7px 14px;
                background: rgba(255, 255, 255, 0.06);
                color: rgba(255, 255, 255, 0.88);
                font: inherit;
                cursor: pointer;
            }

            #app-loader.has-error .loader-bar-bg {
                display: none;
            }

            #app-loader.has-error .loader-error,
            #app-loader.has-error .loader-retry {
                display: block;
            }

            @keyframes breath {

                0%,
                100% {
                    transform: rotate(45deg) scale(1);
                    border-color: rgba(255, 255, 255, 0.1);
                }

                50% {
                    transform: rotate(45deg) scale(1.05);
                    border-color: rgba(255, 255, 255, 0.2);
                }
            }

            @keyframes inner-pulse {

                0%,
                100% {
                    transform: rotate(45deg) scale(1);
                    opacity: 1;
                }

                50% {
                    transform: rotate(45deg) scale(0.85);
                    opacity: 0.8;
                }
            }

            @keyframes shimmer {
                0% {
                    transform: translateX(-100%);
                }

                100% {
                    transform: translateX(200%);
                }
            }

            @keyframes fade-in-up {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
        <div id="app-loader">
            <div class="loader-content">
                <div class="logo-container">
                    <img class="logo-image" src="/oxide-logo.png" alt="" />
                </div>
                <div class="loader-text">OXIDE STUDIO</div>
                <div class="loader-bar-bg">
                    <div class="loader-bar-fill"></div>
                </div>
                <div id="loader-error" class="loader-error"></div>
                <button id="loader-retry" class="loader-retry" type="button">Reload</button>
            </div>
        </div>
    </div>
    <style>
        #portal {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
        }

        #portal>* {
            pointer-events: auto;
        }
    </style>
    <div id="portal"></div>
    <script>
        (() => {
            let startupError;

            const describeError = (error) => {
                if (error instanceof Error) return `${error.name}: ${error.message}`;
                if (typeof error === "string") return error;
                try {
                    return JSON.stringify(error);
                } catch {
                    return String(error);
                }
            };

            window.addEventListener("error", (event) => {
                if (event.target === window) startupError = describeError(event.error ?? event.message);
            });
            window.addEventListener("unhandledrejection", (event) => {
                startupError = describeError(event.reason);
            });

            window.setTimeout(() => {
                const loader = document.getElementById("app-loader");
                if (!loader) return;

                loader.classList.add("has-error");
                const error = document.getElementById("loader-error");
                if (error) {
                    error.textContent = startupError
                        ? `OxideStudio failed to start: ${startupError}`
                        : "OxideStudio did not finish starting. Reload the window to try again.";
                }
                document.getElementById("loader-retry")?.addEventListener("click", () => {
                    window.location.reload();
                });
            }, 15000);
        })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
