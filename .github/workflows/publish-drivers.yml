name: Publish signed driver packages

on:
  workflow_dispatch:
    inputs:
      driver:
        description: Native driver package to build and publish.
        required: true
        default: all
        type: choice
        options: [all, clickhouse, duckdb, rqlite]
      package_version:
        description: Immutable package version, for example 0.1.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: driver-package-publish
  cancel-in-progress: false

env:
  DRIVER_PACKAGE_VERSION: ${{ inputs.package_version }}
  DRIVER_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}

jobs:
  validate:
    name: Validate driver release configuration
    runs-on: ubuntu-22.04
    outputs:
      selected_driver: ${{ steps.input.outputs.selected_driver }}
    steps:
      - name: Validate dispatch inputs and publishing secrets
        id: input
        env:
          SELECTED_DRIVER: ${{ inputs.driver }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          DRIVER_MINISIGN_SECRET_KEY_B64: ${{ secrets.DRIVER_MINISIGN_SECRET_KEY_B64 }}
          DRIVER_MINISIGN_PUBLIC_KEY_B64: ${{ secrets.DRIVER_MINISIGN_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SELECTED_DRIVER" in all|clickhouse|duckdb|rqlite) ;; *) exit 1 ;; esac
          if ! [[ "$DRIVER_PACKAGE_VERSION" =~ ^[A-Za-z0-9._-]{1,96}$ ]]; then
            echo "package_version must contain only letters, digits, dot, underscore, or hyphen." >&2
            exit 1
          fi
          missing=()
          for name in ALIYUN_OSS_ACCESS_KEY_ID ALIYUN_OSS_ACCESS_KEY_SECRET ALIYUN_OSS_BUCKET ALIYUN_OSS_REGION ALIYUN_OSS_ENDPOINT ALIYUN_OSS_PREFIX DRIVER_MINISIGN_SECRET_KEY_B64 DRIVER_MINISIGN_PUBLIC_KEY_B64; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required driver release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "selected_driver=$SELECTED_DRIVER" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.driver }} (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: clickhouse, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { driver: clickhouse, runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { driver: clickhouse, runner: macos-15, target: aarch64-apple-darwin }
          - { driver: duckdb, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { driver: duckdb, runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { driver: duckdb, runner: macos-15, target: aarch64-apple-darwin }
          - { driver: rqlite, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { driver: rqlite, runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { driver: rqlite, runner: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates/oxide-driver-${{ matrix.driver }} -> target
      - name: Build native sidecar
        if: needs.validate.outputs.selected_driver == 'all' || needs.validate.outputs.selected_driver == matrix.driver
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path "src-tauri/crates/oxide-driver-${{ matrix.driver }}/Cargo.toml" --release --target "${{ matrix.target }}"
      - name: Package manifest-bound driver payload
        if: needs.validate.outputs.selected_driver == 'all' || needs.validate.outputs.selected_driver == matrix.driver
        shell: bash
        run: |
          set -euo pipefail
          node "scripts/package-${{ matrix.driver }}-driver.mjs" --target "${{ matrix.target }}" --version "$DRIVER_PACKAGE_VERSION" --out "driver-output/${{ matrix.driver }}/$DRIVER_PACKAGE_VERSION/${{ matrix.target }}"
          test -f "driver-output/${{ matrix.driver }}/$DRIVER_PACKAGE_VERSION/${{ matrix.target }}/manifest.json"
      - uses: actions/upload-artifact@v4
        if: needs.validate.outputs.selected_driver == 'all' || needs.validate.outputs.selected_driver == matrix.driver
        with:
          name: driver-package-${{ matrix.driver }}-${{ matrix.target }}
          path: driver-output/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish immutable driver packages
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      DRIVER_MINISIGN_SECRET_KEY_B64: ${{ secrets.DRIVER_MINISIGN_SECRET_KEY_B64 }}
      DRIVER_MINISIGN_PUBLIC_KEY_B64: ${{ secrets.DRIVER_MINISIGN_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-package-*
          path: driver-artifacts
          merge-multiple: false
      - name: Install pinned minisign and ossutil
        shell: bash
        run: |
          set -euo pipefail
          MINISIGN_ARCHIVE="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --location --retry 3 https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz --output "$MINISIGN_ARCHIVE"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $MINISIGN_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/minisign" && tar -xzf "$MINISIGN_ARCHIVE" -C "$RUNNER_TEMP/minisign"
          sudo install -m 0755 "$RUNNER_TEMP/minisign/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          OSSUTIL_ARCHIVE="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
          curl --fail --location --retry 3 https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip --output "$OSSUTIL_ARCHIVE"
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $OSSUTIL_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ossutil" && unzip -q "$OSSUTIL_ARCHIVE" -d "$RUNNER_TEMP/ossutil"
          OSSUTIL_BIN="$(find "$RUNNER_TEMP/ossutil" -type f -name ossutil -print -quit)"; test -n "$OSSUTIL_BIN"
          sudo install -m 0755 "$OSSUTIL_BIN" /usr/local/bin/ossutil
      - name: Sign, archive, and upload driver packages
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SECRET_KEY="$RUNNER_TEMP/oxide-driver-release.key"; PUBLIC_KEY="$RUNNER_TEMP/oxide-driver-release.pub"
          printf '%s' "$DRIVER_MINISIGN_SECRET_KEY_B64" | base64 --decode > "$SECRET_KEY"
          printf '%s' "$DRIVER_MINISIGN_PUBLIC_KEY_B64" | base64 --decode > "$PUBLIC_KEY"
          PREFIX="${DRIVER_OSS_PREFIX#/}"; PREFIX="${PREFIX%/}"
          DESTINATION="oss://${ALIYUN_OSS_BUCKET}/${PREFIX}/drivers"
          mkdir -p driver-release
          while IFS= read -r -d '' MANIFEST; do
            PACKAGE_DIR="$(dirname "$MANIFEST")"
            readarray -t IDENTITY < <(node -e 'const m=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(m.driverId); console.log(m.packageVersion); console.log(m.supportedTargets[0])' "$MANIFEST")
            DRIVER_ID="${IDENTITY[0]}"; PACKAGE_VERSION="${IDENTITY[1]}"; TARGET="${IDENTITY[2]}"
            case "$DRIVER_ID:$PACKAGE_VERSION:$TARGET" in *[!A-Za-z0-9._:-]*|'') echo "Unsafe driver package identity" >&2; exit 1 ;; esac
            minisign -Sm "$MANIFEST" -s "$SECRET_KEY" -x "$PACKAGE_DIR/manifest.json.minisig"
            minisign -Vm "$MANIFEST" -p "$PUBLIC_KEY" -x "$PACKAGE_DIR/manifest.json.minisig"
            ARCHIVE="driver-release/${DRIVER_ID}-${PACKAGE_VERSION}-${TARGET}.tar.gz"
            tar -C "$PACKAGE_DIR" -czf "$ARCHIVE" -- *
            sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"
            OBJECT_ROOT="$DESTINATION/$DRIVER_ID/$PACKAGE_VERSION/$TARGET"
            for OBJECT in package.tar.gz package.tar.gz.sha256; do
              if ossutil stat "$OBJECT_ROOT/$OBJECT" >/dev/null 2>&1; then
                echo "Driver release object already exists in OSS: $OBJECT_ROOT/$OBJECT" >&2
                echo "Driver package versions are immutable; publish a new package version instead." >&2
                exit 1
              fi
            done
            # Deliberately omit --force: a race or a partially published release
            # must fail rather than replace evidence for an existing version.
            ossutil cp "$ARCHIVE" "$OBJECT_ROOT/package.tar.gz" --cache-control "public,max-age=31536000,immutable"
            ossutil cp "$ARCHIVE.sha256" "$OBJECT_ROOT/package.tar.gz.sha256" --cache-control "public,max-age=31536000,immutable"
            ossutil stat "$OBJECT_ROOT/package.tar.gz"
            ossutil stat "$OBJECT_ROOT/package.tar.gz.sha256"
          done < <(find driver-artifacts -type f -name manifest.json -print0)
      - uses: actions/upload-artifact@v4
        with:
          name: signed-driver-packages-${{ inputs.package_version }}
          path: driver-release/
          if-no-files-found: error
          retention-days: 90
