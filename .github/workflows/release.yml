name: Release to Aliyun OSS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag matching package.json, for example v0.1.1"
        required: true
        type: string
      release_notes:
        description: "Optional notes shown by the desktop updater"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  OXIDE_RELEASE_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate versions and release tag
        id: version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const packageVersion = require("./package.json").version;
          const tauriVersion = require("./src-tauri/tauri.conf.json").version;
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expectedTag = `v${packageVersion}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match ${expectedTag}.`);
          }
          if (tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error(`Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}.`);
          }
          NODE
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate signing and Aliyun configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENABLED: ${{ secrets.ALIYUN_OSS_ENABLED }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
        run: |
          node - <<'NODE'
          const required = [
            "TAURI_SIGNING_PRIVATE_KEY",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
            "OXIDE_UPDATER_PUBLIC_KEY",
            "OXIDE_RELEASE_BASE_URL",
            "ALIYUN_OSS_ACCESS_KEY_ID",
            "ALIYUN_OSS_ACCESS_KEY_SECRET",
            "ALIYUN_OSS_BUCKET",
            "ALIYUN_OSS_ENABLED",
            "ALIYUN_OSS_REGION",
            "ALIYUN_OSS_ENDPOINT",
            "ALIYUN_OSS_PREFIX",
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing GitHub configuration: ${missing.join(", ")}`);
          if (!/^(1|true|yes|on)$/i.test(process.env.ALIYUN_OSS_ENABLED.trim())) {
            throw new Error("ALIYUN_OSS_ENABLED must be true to publish a release.");
          }
          NODE
          node scripts/write-tauri-release-config.mjs

      - name: Test release manifest generator
        run: npm run test:release

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos
            name: macOS universal
            platform: macos-latest
            args: "--target universal-apple-darwin"
          - id: linux
            name: Linux x86_64
            platform: ubuntu-22.04
            args: ""
          - id: windows
            name: Windows x86_64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository and SQL LSP
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for universal macOS binary
        if: matrix.id == 'macos'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux bundle dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Aliyun updater endpoint
        env:
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/write-tauri-release-config.mjs

      - name: Build signed Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Upload bundles for OSS publication
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  publish:
    name: Publish and verify Aliyun OSS release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download signed Tauri bundles
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-bundle-*
          path: release-input

      - name: Build static updater manifest and checksums
        env:
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          node scripts/package-oss-release.mjs \
            --input release-input \
            --output release-output \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --base-url "$OXIDE_RELEASE_BASE_URL"

      - name: Verify Tauri updater signatures locally
        env:
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          PUBLIC_KEY_FILE="$RUNNER_TEMP/oxide-studio.pub"
          export PUBLIC_KEY_FILE
          node -e 'require("node:fs").writeFileSync(process.env.PUBLIC_KEY_FILE, Buffer.from(process.env.OXIDE_UPDATER_PUBLIC_KEY, "base64"))'
          SIGNATURE_COUNT=0
          while IFS= read -r -d '' SIGNATURE_FILE; do
            ARTIFACT_FILE="${SIGNATURE_FILE%.sig}"
            MINISIGN_FILE="$RUNNER_TEMP/$(basename "$SIGNATURE_FILE").minisig"
            export SIGNATURE_FILE MINISIGN_FILE
            node -e 'const fs=require("node:fs"); fs.writeFileSync(process.env.MINISIGN_FILE, Buffer.from(fs.readFileSync(process.env.SIGNATURE_FILE, "utf8").trim(), "base64"))'
            minisign -Vm "$ARTIFACT_FILE" -p "$PUBLIC_KEY_FILE" -x "$MINISIGN_FILE"
            SIGNATURE_COUNT=$((SIGNATURE_COUNT + 1))
          done < <(find "release-output/$RELEASE_TAG" -type f -name '*.sig' -print0)
          test "$SIGNATURE_COUNT" -gt 0

      - name: Install pinned ossutil
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_ARCHIVE="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
          curl --fail --location --retry 3 \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip \
            --output "$OSSUTIL_ARCHIVE"
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $OSSUTIL_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ossutil"
          unzip -q "$OSSUTIL_ARCHIVE" -d "$RUNNER_TEMP/ossutil"
          OSSUTIL_BIN="$(find "$RUNNER_TEMP/ossutil" -type f -name ossutil -print -quit)"
          test -n "$OSSUTIL_BIN"
          sudo install -m 0755 "$OSSUTIL_BIN" /usr/local/bin/ossutil
          ossutil version

      - name: Upload immutable version and publish latest manifest
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${ALIYUN_OSS_PREFIX#/}"
          PREFIX="${PREFIX%/}"
          DESTINATION="oss://${ALIYUN_OSS_BUCKET}/${PREFIX}"
          while IFS= read -r -d '' FILE; do
            OBJECT_PATH="${FILE#release-output/$RELEASE_TAG/}"
            ossutil cp "$FILE" "$DESTINATION/$RELEASE_TAG/$OBJECT_PATH" \
              --force \
              --cache-control "public,max-age=31536000,immutable"
          done < <(find "release-output/$RELEASE_TAG" -type f -print0)
          ossutil stat "$DESTINATION/$RELEASE_TAG/release.json"
          ossutil cp release-output/latest.json "$DESTINATION/latest.json" \
            --force \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"
          ossutil stat "$DESTINATION/latest.json"

      - name: Verify public update downloads use Aliyun OSS
        run: node scripts/verify-oss-release.mjs

      - name: Preserve release index
        uses: actions/upload-artifact@v4
        with:
          name: oxide-studio-${{ needs.validate.outputs.tag }}-release-index
          retention-days: 30
          path: |
            release-output/latest.json
            release-output/${{ needs.validate.outputs.tag }}/latest.json
            release-output/${{ needs.validate.outputs.tag }}/release.json
            release-output/${{ needs.validate.outputs.tag }}/checksums.sha256
