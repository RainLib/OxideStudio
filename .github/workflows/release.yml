name: Release to Aliyun OSS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag matching package.json, for example v0.1.1"
        required: true
        type: string
      release_notes:
        description: "Optional notes shown by the desktop updater"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  OXIDE_RELEASE_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
  WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      apple_signing_enabled: ${{ steps.signing.outputs.apple_signing_enabled }}
      windows_signing_enabled: ${{ steps.signing.outputs.windows_signing_enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate versions and release tag
        id: version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const packageVersion = require("./package.json").version;
          const tauriVersion = require("./src-tauri/tauri.conf.json").version;
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expectedTag = `v${packageVersion}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match ${expectedTag}.`);
          }
          if (tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error(`Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}.`);
          }
          NODE
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate signing and Aliyun configuration
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENABLED: ${{ secrets.ALIYUN_OSS_ENABLED }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          node - <<'NODE'
          const required = [
            "TAURI_SIGNING_PRIVATE_KEY",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
            "OXIDE_UPDATER_PUBLIC_KEY",
            "OXIDE_RELEASE_BASE_URL",
            "ALIYUN_OSS_ACCESS_KEY_ID",
            "ALIYUN_OSS_ACCESS_KEY_SECRET",
            "ALIYUN_OSS_BUCKET",
            "ALIYUN_OSS_ENABLED",
            "ALIYUN_OSS_REGION",
            "ALIYUN_OSS_ENDPOINT",
            "ALIYUN_OSS_PREFIX",
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing GitHub configuration: ${missing.join(", ")}`);
          if (!/^(1|true|yes|on)$/i.test(process.env.ALIYUN_OSS_ENABLED.trim())) {
            throw new Error("ALIYUN_OSS_ENABLED must be true to publish a release.");
          }

          NODE
          node scripts/resolve-platform-signing.mjs
          node scripts/write-tauri-release-config.mjs

      - name: Test release manifest generator
        run: npm run test:release

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos
            name: macOS universal
            platform: macos-latest
            args: "--target universal-apple-darwin"
          - id: linux
            name: Linux x86_64
            platform: ubuntu-22.04
            args: ""
          - id: windows
            name: Windows x86_64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository and SQL LSP
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for universal macOS binary
        if: matrix.id == 'macos'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux bundle dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Aliyun updater endpoint
        env:
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ matrix.id == 'windows' && secrets.WINDOWS_CERTIFICATE_THUMBPRINT || '' }}
        run: node scripts/write-tauri-release-config.mjs

      - name: Import Apple Developer ID certificate
        if: matrix.id == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/oxide-studio-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/oxide-studio-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal macOS SQL LSP
        if: matrix.id == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release \
            --manifest-path vendor/sql-lsp/Cargo.toml \
            --target aarch64-apple-darwin
          cargo build --release \
            --manifest-path vendor/sql-lsp/Cargo.toml \
            --target x86_64-apple-darwin
          lipo -create \
            vendor/sql-lsp/target/aarch64-apple-darwin/release/sql-lsp \
            vendor/sql-lsp/target/x86_64-apple-darwin/release/sql-lsp \
            -output src-tauri/binaries/sql-lsp
          chmod 0755 src-tauri/binaries/sql-lsp
          lipo -verify_arch x86_64 arm64 src-tauri/binaries/sql-lsp

      - name: Sign universal macOS SQL LSP
        if: matrix.id == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            src-tauri/binaries/sql-lsp
          codesign --verify --strict --verbose=2 src-tauri/binaries/sql-lsp

      - name: Import Windows Authenticode certificate
        if: matrix.id == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "oxide-studio-authenticode.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificates = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          $expectedThumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $signingCertificate = $certificates |
            Where-Object { $_.Thumbprint -eq $expectedThumbprint } |
            Select-Object -First 1
          if (-not $signingCertificate) {
            throw "Imported certificate thumbprint does not match WINDOWS_CERTIFICATE_THUMBPRINT."
          }
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found." }
          "WINDOWS_SIGNTOOL=$($signTool.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          "WINDOWS_CERTIFICATE_THUMBPRINT=$expectedThumbprint" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Build and sign Windows SQL LSP
        if: matrix.id == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/prepare-sql-lsp.mjs
          if ($LASTEXITCODE -ne 0) { throw "SQL LSP build failed." }
          & $env:WINDOWS_SIGNTOOL sign `
            /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT `
            /fd SHA256 `
            /tr $env:WINDOWS_TIMESTAMP_URL `
            /td SHA256 `
            src-tauri\binaries\sql-lsp.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing sql-lsp.exe failed." }
          & $env:WINDOWS_SIGNTOOL verify /pa /v src-tauri\binaries\sql-lsp.exe
          if ($LASTEXITCODE -ne 0) { throw "Verifying sql-lsp.exe failed." }

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          OXIDE_SKIP_SQL_LSP_PREPARE: ${{ (matrix.id == 'macos' || (matrix.id == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true')) && '1' || '' }}
          APPLE_ID: ${{ matrix.id == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.id == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.id == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify macOS Developer ID signature and notarization ticket
        if: matrix.id == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Verify Windows Authenticode signatures
        if: matrix.id == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundles = Get-ChildItem src-tauri\target -Recurse -File |
            Where-Object {
              $_.FullName -match '\\bundle\\(nsis|msi)\\' -and
              $_.Extension -in ".exe", ".msi"
            }
          if (-not $bundles) { throw "No Windows installers were found." }
          foreach ($bundle in $bundles) {
            & $env:WINDOWS_SIGNTOOL verify /pa /v $bundle.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed: $($bundle.FullName)"
            }
          }

      - name: Upload bundles for OSS publication
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundle-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage*
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/msi/*.msi*
            src-tauri/target/**/release/bundle/nsis/*-setup.exe*
            src-tauri/target/**/release/bundle/rpm/*.rpm

  publish:
    name: Publish and verify Aliyun OSS release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download Tauri bundles
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-bundle-*
          path: release-input

      - name: Build static updater manifest and checksums
        env:
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          node scripts/package-oss-release.mjs \
            --input release-input \
            --output release-output \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --base-url "$OXIDE_RELEASE_BASE_URL"

      - name: Install pinned minisign
        shell: bash
        run: |
          set -euo pipefail
          MINISIGN_ARCHIVE="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$MINISIGN_ARCHIVE"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $MINISIGN_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/minisign"
          tar -xzf "$MINISIGN_ARCHIVE" -C "$RUNNER_TEMP/minisign"
          sudo install -m 0755 \
            "$RUNNER_TEMP/minisign/minisign-linux/x86_64/minisign" \
            /usr/local/bin/minisign

      - name: Verify Tauri updater signatures locally
        env:
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_KEY_FILE="$RUNNER_TEMP/oxide-studio.pub"
          export PUBLIC_KEY_FILE
          node -e 'require("node:fs").writeFileSync(process.env.PUBLIC_KEY_FILE, Buffer.from(process.env.OXIDE_UPDATER_PUBLIC_KEY, "base64"))'
          SIGNATURE_COUNT=0
          while IFS= read -r -d '' SIGNATURE_FILE; do
            ARTIFACT_FILE="${SIGNATURE_FILE%.sig}"
            MINISIGN_FILE="$RUNNER_TEMP/$(basename "$SIGNATURE_FILE").minisig"
            export SIGNATURE_FILE MINISIGN_FILE
            node -e 'const fs=require("node:fs"); fs.writeFileSync(process.env.MINISIGN_FILE, Buffer.from(fs.readFileSync(process.env.SIGNATURE_FILE, "utf8").trim(), "base64"))'
            minisign -Vm "$ARTIFACT_FILE" -p "$PUBLIC_KEY_FILE" -x "$MINISIGN_FILE"
            SIGNATURE_COUNT=$((SIGNATURE_COUNT + 1))
          done < <(find "release-output/$RELEASE_TAG" -type f -name '*.sig' -print0)
          test "$SIGNATURE_COUNT" -gt 0

      - name: Install pinned ossutil
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_ARCHIVE="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
          curl --fail --location --retry 3 \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip \
            --output "$OSSUTIL_ARCHIVE"
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $OSSUTIL_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ossutil"
          unzip -q "$OSSUTIL_ARCHIVE" -d "$RUNNER_TEMP/ossutil"
          OSSUTIL_BIN="$(find "$RUNNER_TEMP/ossutil" -type f -name ossutil -print -quit)"
          test -n "$OSSUTIL_BIN"
          sudo install -m 0755 "$OSSUTIL_BIN" /usr/local/bin/ossutil
          ossutil version

      - name: Upload immutable version and publish latest manifest
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${ALIYUN_OSS_PREFIX#/}"
          PREFIX="${PREFIX%/}"
          DESTINATION="oss://${ALIYUN_OSS_BUCKET}/${PREFIX}"
          while IFS= read -r -d '' FILE; do
            OBJECT_PATH="${FILE#release-output/$RELEASE_TAG/}"
            ossutil cp "$FILE" "$DESTINATION/$RELEASE_TAG/$OBJECT_PATH" \
              --force \
              --cache-control "public,max-age=31536000,immutable"
          done < <(find "release-output/$RELEASE_TAG" -type f -print0)
          ossutil stat "$DESTINATION/$RELEASE_TAG/release.json"
          ossutil cp release-output/latest.json "$DESTINATION/latest.json" \
            --force \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"
          ossutil stat "$DESTINATION/latest.json"

      - name: Verify public update downloads use Aliyun OSS
        run: node scripts/verify-oss-release.mjs

      - name: Preserve release index
        uses: actions/upload-artifact@v7
        with:
          name: oxide-studio-${{ needs.validate.outputs.tag }}-release-index
          retention-days: 30
          path: |
            release-output/latest.json
            release-output/${{ needs.validate.outputs.tag }}/latest.json
            release-output/${{ needs.validate.outputs.tag }}/release.json
            release-output/${{ needs.validate.outputs.tag }}/checksums.sha256
