name: Release desktop packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  OXIDE_RELEASE_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
  ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
  WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      oss_enabled: ${{ steps.distribution.outputs.oss_enabled }}
      apple_signing_enabled: ${{ steps.distribution.outputs.apple_signing_enabled }}
      windows_signing_enabled: ${{ steps.distribution.outputs.windows_signing_enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate versions and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test -n "$TAG_SHA"
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Release checkout $HEAD_SHA does not match $RELEASE_TAG ($TAG_SHA)." >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const packageVersion = require("./package.json").version;
          const tauriVersion = require("./src-tauri/tauri.conf.json").version;
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expectedTag = `v${packageVersion}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match ${expectedTag}.`);
          }
          if (tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error(`Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}.`);
          }
          NODE
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate signing and optional Aliyun configuration
        id: distribution
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENABLED: ${{ secrets.ALIYUN_OSS_ENABLED }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          DRIVER_MINISIGN_PUBLIC_KEY_B64: ${{ secrets.DRIVER_MINISIGN_PUBLIC_KEY_B64 }}
          ALLOW_UNSIGNED_RELEASE: "true"
        run: |
          node - <<'NODE'
          if (!process.env.DRIVER_MINISIGN_PUBLIC_KEY_B64?.trim()) {
            throw new Error("DRIVER_MINISIGN_PUBLIC_KEY_B64 is required so release builds can verify signed driver and SQLite worker packages.");
          }
          const ossRequired = [
            "TAURI_SIGNING_PRIVATE_KEY",
            "OXIDE_UPDATER_PUBLIC_KEY",
            "OXIDE_RELEASE_BASE_URL",
            "ALIYUN_OSS_ACCESS_KEY_ID",
            "ALIYUN_OSS_ACCESS_KEY_SECRET",
            "ALIYUN_OSS_BUCKET",
            "ALIYUN_OSS_ENABLED",
            "ALIYUN_OSS_REGION",
            "ALIYUN_OSS_ENDPOINT",
            "ALIYUN_OSS_PREFIX",
          ];
          const configured = ossRequired.filter((name) => process.env[name]?.trim());
          const missing = ossRequired.filter((name) => !process.env[name]?.trim());
          const ossEnabled = configured.length === ossRequired.length && /^(1|true|yes|on)$/i.test(process.env.ALIYUN_OSS_ENABLED.trim());
          if (!ossEnabled) {
            const detail = configured.length > 0
              ? `Aliyun updater configuration is incomplete; missing: ${missing.join(", ")}.`
              : "Aliyun updater configuration is absent.";
            console.warn(`::warning title=GitHub Release fallback::${detail} Publishing unsigned bundles to GitHub Release without OTA metadata.`);
          }
          const signingGroups = [
            ["apple_signing_enabled", ["APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "APPLE_ID", "APPLE_PASSWORD", "APPLE_TEAM_ID", "KEYCHAIN_PASSWORD"]],
            ["windows_signing_enabled", ["WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD", "WINDOWS_CERTIFICATE_THUMBPRINT"]],
          ];
          const outputs = [`oss_enabled=${ossEnabled}`];
          for (const [output, names] of signingGroups) {
            const present = names.filter((name) => process.env[name]?.trim());
            const enabled = present.length === names.length;
            if (present.length > 0 && !enabled) {
              const groupMissing = names.filter((name) => !process.env[name]?.trim());
              console.warn(`::warning title=Unsigned platform bundle::${output} is partial; skipping signing because ${groupMissing.join(", ")} is missing.`);
            }
            outputs.push(`${output}=${enabled}`);
          }
          require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `${outputs.join("\n")}\n`);
          NODE

      - name: Configure Aliyun updater endpoint
        if: steps.distribution.outputs.oss_enabled == 'true'
        env:
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: node scripts/write-tauri-release-config.mjs

      - name: Test release manifest generator
        run: npm run test:release

      - name: Test frontend and agent contracts
        run: |
          npm run test:agent-contract
          npm run test:agent-host
          npm run build
          npm run enterprise:admin:build

  quality:
    name: Validate Rust workspaces
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
          workspaces: |
            ./src-tauri -> target
            ./enterprise -> target

      - name: Check formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path enterprise/Cargo.toml --all -- --check

      - name: Run Clippy
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clean --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path enterprise/Cargo.toml --workspace --all-targets -- -D warnings
          cargo clean --manifest-path enterprise/Cargo.toml

      - name: Test Rust workspaces
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo clean --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path enterprise/Cargo.toml --workspace

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        run: sccache --show-stats

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            name: macOS arm64
            family: macos
            platform: macos-15
            target: aarch64-apple-darwin
            mac_arch: arm64
            args: "--target aarch64-apple-darwin"
          - id: macos-x86_64
            name: macOS x86_64
            family: macos
            platform: macos-15-intel
            target: x86_64-apple-darwin
            mac_arch: x86_64
            args: "--target x86_64-apple-darwin"
          - id: linux-x86_64
            name: Linux x86_64
            family: linux
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          - id: windows-x86_64
            name: Windows x86_64
            family: windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout repository and SQL LSP
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Go for the RocketMQ workspace agent
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache-dependency-path: src-tauri/agents/rocketmq/go.sum

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Setup Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}
          cache-targets: false

      - name: Install Linux bundle dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Package target-specific agent host
        run: npm run agent-host:package -- --target ${{ matrix.target }}

      - name: Build target-specific oxide-agent
        run: node scripts/prepare-oxide-agent.mjs --target ${{ matrix.target }}

      - name: Build target-specific RocketMQ workspace agent
        shell: bash
        run: TAURI_ENV_TARGET_TRIPLE="${{ matrix.target }}" node scripts/prepare-rocketmq-agent.mjs

      - name: Verify Unix agent host
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          AGENT_HOST="src-tauri/binaries/oxide-agent-host-${{ matrix.target }}"
          OXIDE_AGENT="src-tauri/binaries/oxide-agent-${{ matrix.target }}"
          ROCKETMQ_AGENT="src-tauri/binaries/oxide-agent-rocketmq-${{ matrix.target }}"
          test -f "$AGENT_HOST"
          test -f "$OXIDE_AGENT"
          test -f "$ROCKETMQ_AGENT"
          chmod 0755 "$AGENT_HOST"
          chmod 0755 "$OXIDE_AGENT"
          chmod 0755 "$ROCKETMQ_AGENT"
          if [[ "${{ matrix.family }}" == "macos" ]]; then
            lipo "$AGENT_HOST" -verify_arch "${{ matrix.mac_arch }}"
            lipo "$OXIDE_AGENT" -verify_arch "${{ matrix.mac_arch }}"
            lipo "$ROCKETMQ_AGENT" -verify_arch "${{ matrix.mac_arch }}"
          fi

      - name: Verify Windows agent host
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $agentHost = "src-tauri\binaries\oxide-agent-host-${{ matrix.target }}.exe"
          $oxideAgent = "src-tauri\binaries\oxide-agent-${{ matrix.target }}.exe"
          $rocketMqAgent = "src-tauri\binaries\oxide-agent-rocketmq-${{ matrix.target }}.exe"
          if (-not (Test-Path $agentHost -PathType Leaf)) {
            throw "Packaged agent host was not found: $agentHost"
          }
          if (-not (Test-Path $oxideAgent -PathType Leaf)) {
            throw "Packaged oxide-agent was not found: $oxideAgent"
          }
          if (-not (Test-Path $rocketMqAgent -PathType Leaf)) {
            throw "Packaged RocketMQ workspace agent was not found: $rocketMqAgent"
          }

      - name: Smoke target-specific agent runtimes
        shell: bash
        run: |
          set -euo pipefail
          EXTENSION=""
          if [[ "${{ matrix.family }}" == "windows" ]]; then EXTENSION=".exe"; fi
          node scripts/smoke-agent-host.mjs \
            --binary "src-tauri/binaries/oxide-agent-host-${{ matrix.target }}${EXTENSION}"
          "src-tauri/binaries/oxide-agent-${{ matrix.target }}${EXTENSION}" tools list \
            | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const tools=JSON.parse(s); if (tools.length !== 5 || tools.some(tool => !tool.readOnly || tool.destructive)) process.exit(1); });'

      - name: Configure signed package trust
        env:
          DRIVER_MINISIGN_PUBLIC_KEY_B64: ${{ secrets.DRIVER_MINISIGN_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const key = Buffer.from(process.env.DRIVER_MINISIGN_PUBLIC_KEY_B64 || "", "base64")
            .toString("utf8")
            .trimEnd();
          if (!key || key.includes("\0") || key.includes("OXIDE_DRIVER_TRUST_EOF")) {
            throw new Error("Signed package public key is invalid.");
          }
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `OXIDE_DRIVER_SIGNING_PUBLIC_KEY<<OXIDE_DRIVER_TRUST_EOF\n${key}\nOXIDE_DRIVER_TRUST_EOF\n`,
          );
          NODE

      - name: Configure Aliyun updater endpoint
        if: needs.validate.outputs.oss_enabled == 'true'
        env:
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ matrix.family == 'windows' && secrets.WINDOWS_CERTIFICATE_THUMBPRINT || '' }}
        run: node scripts/write-tauri-release-config.mjs

      - name: Import Apple Developer ID certificate
        if: matrix.family == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/oxide-studio-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/oxide-studio-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build target-specific macOS SQL LSP
        if: matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release \
            --manifest-path vendor/sql-lsp/Cargo.toml \
            --target "${{ matrix.target }}"
          cp \
            "vendor/sql-lsp/target/${{ matrix.target }}/release/sql-lsp" \
            src-tauri/binaries/sql-lsp
          chmod 0755 src-tauri/binaries/sql-lsp
          lipo src-tauri/binaries/sql-lsp -verify_arch "${{ matrix.mac_arch }}"

      - name: Sign target-specific macOS runtime binaries
        if: matrix.family == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AGENT_HOST="src-tauri/binaries/oxide-agent-host-${{ matrix.target }}"
          OXIDE_AGENT="src-tauri/binaries/oxide-agent-${{ matrix.target }}"
          for BINARY in src-tauri/binaries/sql-lsp "$OXIDE_AGENT"; do
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$BINARY"
            codesign --verify --strict --verbose=2 "$BINARY"
          done
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements src-tauri/entitlements/agent-host.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$AGENT_HOST"
          codesign --verify --strict --verbose=2 "$AGENT_HOST"
          ENTITLEMENTS_FILE="$RUNNER_TEMP/oxide-agent-host-entitlements.plist"
          codesign -d --entitlements :- "$AGENT_HOST" > "$ENTITLEMENTS_FILE" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' "$ENTITLEMENTS_FILE")" = "true"
          node scripts/smoke-agent-host.mjs --binary "$AGENT_HOST"

      - name: Import Windows Authenticode certificate
        if: matrix.family == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "oxide-studio-authenticode.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificates = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          $expectedThumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $signingCertificate = $certificates |
            Where-Object { $_.Thumbprint -eq $expectedThumbprint } |
            Select-Object -First 1
          if (-not $signingCertificate) {
            throw "Imported certificate thumbprint does not match WINDOWS_CERTIFICATE_THUMBPRINT."
          }
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found." }
          "WINDOWS_SIGNTOOL=$($signTool.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          "WINDOWS_CERTIFICATE_THUMBPRINT=$expectedThumbprint" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Build and sign Windows runtime binaries
        if: matrix.family == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/prepare-sql-lsp.mjs
          if ($LASTEXITCODE -ne 0) { throw "SQL LSP build failed." }
          $runtimeBinaries = @(
            "src-tauri\binaries\sql-lsp.exe",
            "src-tauri\binaries\oxide-agent-host-${{ matrix.target }}.exe",
            "src-tauri\binaries\oxide-agent-${{ matrix.target }}.exe"
          )
          foreach ($binary in $runtimeBinaries) {
            & $env:WINDOWS_SIGNTOOL sign `
              /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT `
              /fd SHA256 `
              /tr $env:WINDOWS_TIMESTAMP_URL `
              /td SHA256 `
              $binary
            if ($LASTEXITCODE -ne 0) { throw "Signing $binary failed." }
            & $env:WINDOWS_SIGNTOOL verify /pa /v $binary
            if ($LASTEXITCODE -ne 0) { throw "Verifying $binary failed." }
          }
          node scripts/smoke-agent-host.mjs `
            --binary "src-tauri\binaries\oxide-agent-host-${{ matrix.target }}.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signed agent host smoke failed." }

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          OXIDE_SKIP_SQL_LSP_PREPARE: ${{ (matrix.family == 'macos' || (matrix.family == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true')) && '1' || '' }}
          OXIDE_SKIP_AGENT_HOST_PACKAGE: "1"
          OXIDE_SKIP_OXIDE_AGENT_PREPARE: "1"
          APPLE_ID: ${{ matrix.family == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.family == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.family == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          args: ${{ matrix.args }} ${{ needs.validate.outputs.oss_enabled == 'true' && '--config src-tauri/tauri.release.conf.json' || '' }}

      - name: Verify macOS Developer ID signature and notarization ticket
        if: matrix.family == 'macos' && needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          BUNDLED_AGENT_HOST="$APP_PATH/Contents/MacOS/oxide-agent-host"
          test -x "$BUNDLED_AGENT_HOST"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          BUNDLED_ENTITLEMENTS="$RUNNER_TEMP/bundled-agent-host-entitlements.plist"
          codesign -d --entitlements :- "$BUNDLED_AGENT_HOST" > "$BUNDLED_ENTITLEMENTS" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' "$BUNDLED_ENTITLEMENTS")" = "true"
          node scripts/smoke-agent-host.mjs --binary "$BUNDLED_AGENT_HOST"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Verify Windows Authenticode signatures
        if: matrix.family == 'windows' && needs.validate.outputs.windows_signing_enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundles = Get-ChildItem src-tauri\target -Recurse -File |
            Where-Object {
              $_.FullName -match '\\bundle\\(nsis|msi)\\' -and
              $_.Extension -in ".exe", ".msi"
            }
          if (-not $bundles) { throw "No Windows installers were found." }
          foreach ($bundle in $bundles) {
            & $env:WINDOWS_SIGNTOOL verify /pa /v $bundle.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed: $($bundle.FullName)"
            }
          }

      - name: Upload bundles for OSS publication
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundle-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/binaries/oxide-agent-${{ matrix.target }}
            src-tauri/binaries/oxide-agent-${{ matrix.target }}.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage*
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/msi/*.msi*
            src-tauri/target/**/release/bundle/nsis/*-setup.exe*
            src-tauri/target/**/release/bundle/rpm/*.rpm

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        run: sccache --show-stats

  publish:
    name: Publish GitHub Release and optional Aliyun updater
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download Tauri bundles
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-bundle-*
          path: release-input

      - name: Build static updater manifest and checksums
        if: needs.validate.outputs.oss_enabled == 'true'
        env:
          RELEASE_NOTES: ""
        run: |
          node scripts/package-oss-release.mjs \
            --input release-input \
            --output release-output \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --base-url "$OXIDE_RELEASE_BASE_URL"

      - name: Install pinned minisign
        if: needs.validate.outputs.oss_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          MINISIGN_ARCHIVE="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$MINISIGN_ARCHIVE"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $MINISIGN_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/minisign"
          tar -xzf "$MINISIGN_ARCHIVE" -C "$RUNNER_TEMP/minisign"
          sudo install -m 0755 \
            "$RUNNER_TEMP/minisign/minisign-linux/x86_64/minisign" \
            /usr/local/bin/minisign

      - name: Verify Tauri updater signatures locally
        if: needs.validate.outputs.oss_enabled == 'true'
        env:
          OXIDE_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_KEY_FILE="$RUNNER_TEMP/oxide-studio.pub"
          export PUBLIC_KEY_FILE
          node -e 'require("node:fs").writeFileSync(process.env.PUBLIC_KEY_FILE, Buffer.from(process.env.OXIDE_UPDATER_PUBLIC_KEY, "base64"))'
          SIGNATURE_COUNT=0
          while IFS= read -r -d '' SIGNATURE_FILE; do
            ARTIFACT_FILE="${SIGNATURE_FILE%.sig}"
            MINISIGN_FILE="$RUNNER_TEMP/$(basename "$SIGNATURE_FILE").minisig"
            export SIGNATURE_FILE MINISIGN_FILE
            node -e 'const fs=require("node:fs"); fs.writeFileSync(process.env.MINISIGN_FILE, Buffer.from(fs.readFileSync(process.env.SIGNATURE_FILE, "utf8").trim(), "base64"))'
            minisign -Vm "$ARTIFACT_FILE" -p "$PUBLIC_KEY_FILE" -x "$MINISIGN_FILE"
            SIGNATURE_COUNT=$((SIGNATURE_COUNT + 1))
          done < <(find "release-output/$RELEASE_TAG" -type f -name '*.sig' -print0)
          test "$SIGNATURE_COUNT" -gt 0

      - name: Install pinned ossutil
        if: needs.validate.outputs.oss_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_ARCHIVE="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
          curl --fail --location --retry 3 \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip \
            --output "$OSSUTIL_ARCHIVE"
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $OSSUTIL_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ossutil"
          unzip -q "$OSSUTIL_ARCHIVE" -d "$RUNNER_TEMP/ossutil"
          OSSUTIL_BIN="$(find "$RUNNER_TEMP/ossutil" -type f -name ossutil -print -quit)"
          test -n "$OSSUTIL_BIN"
          sudo install -m 0755 "$OSSUTIL_BIN" /usr/local/bin/ossutil
          ossutil version

      - name: Upload immutable version assets
        if: needs.validate.outputs.oss_enabled == 'true'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${ALIYUN_OSS_PREFIX#/}"
          PREFIX="${PREFIX%/}"
          DESTINATION="oss://${ALIYUN_OSS_BUCKET}/${PREFIX}"
          if ossutil stat "$DESTINATION/$RELEASE_TAG/release.json" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists in OSS; versioned assets are immutable." >&2
            exit 1
          fi
          while IFS= read -r -d '' FILE; do
            OBJECT_PATH="${FILE#release-output/$RELEASE_TAG/}"
            ossutil cp "$FILE" "$DESTINATION/$RELEASE_TAG/$OBJECT_PATH" \
              --force \
              --cache-control "public,max-age=31536000,immutable"
          done < <(find "release-output/$RELEASE_TAG" -type f -print0)
          ossutil stat "$DESTINATION/$RELEASE_TAG/release.json"

      - name: Verify immutable version assets from the public endpoint
        if: needs.validate.outputs.oss_enabled == 'true'
        env:
          OXIDE_VERIFY_VERSIONED_ASSETS: "1"
          OXIDE_EXPECTED_RELEASE_INDEX: release-output/${{ needs.validate.outputs.tag }}/release.json
        run: node scripts/verify-oss-release.mjs

      - name: Publish latest manifest after immutable assets pass verification
        if: needs.validate.outputs.oss_enabled == 'true'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${ALIYUN_OSS_PREFIX#/}"
          PREFIX="${PREFIX%/}"
          DESTINATION="oss://${ALIYUN_OSS_BUCKET}/${PREFIX}"
          ossutil cp release-output/latest.json "$DESTINATION/latest.json" \
            --force \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"
          ossutil stat "$DESTINATION/latest.json"

      - name: Verify public update downloads use Aliyun OSS
        if: needs.validate.outputs.oss_enabled == 'true'
        run: node scripts/verify-oss-release.mjs

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: OxideStudio ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-input/**/*
          fail_on_unmatched_files: true

      - name: Preserve release index
        if: needs.validate.outputs.oss_enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oxide-studio-${{ needs.validate.outputs.tag }}-release-index
          retention-days: 30
          path: |
            release-output/latest.json
            release-output/${{ needs.validate.outputs.tag }}/latest.json
            release-output/${{ needs.validate.outputs.tag }}/release.json
            release-output/${{ needs.validate.outputs.tag }}/checksums.sha256
