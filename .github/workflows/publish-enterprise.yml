name: Publish enterprise images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-enterprise-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate enterprise image release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      image_owner: ${{ steps.image_owner.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate immutable desktop release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$TAG_SHA" = "$(git rev-parse HEAD)"
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Normalize GHCR owner
        id: image_owner
        shell: bash
        run: echo "value=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: control-plane
            dockerfile: enterprise/deploy/Dockerfile.control-plane
          - component: gateway
            dockerfile: enterprise/deploy/Dockerfile.gateway
          - component: admin-web
            dockerfile: enterprise/deploy/Dockerfile.admin-web
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.image_owner }}/oxidestudio-enterprise-${{ matrix.component }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=enterprise-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=enterprise-${{ matrix.component }}

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish digest to job summary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo "\`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Use this exact digest in the Kubernetes overlay after verifying the attached provenance."
          } >> "$GITHUB_STEP_SUMMARY"
