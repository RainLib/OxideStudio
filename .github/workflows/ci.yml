name: CI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and agent contracts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test deterministic release contracts
        run: npm run test:release

      - name: Test agent contract
        run: npm run test:agent-contract

      - name: Test Deep Agents host
        run: npm run test:agent-host

      - name: Build frontend and admin console
        run: |
          npm run build
          npm run enterprise:admin:build

  rust:
    name: Rust desktop and enterprise
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./enterprise -> target

      - name: Check formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path enterprise/Cargo.toml --all -- --check

      - name: Run Clippy
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path enterprise/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspaces
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo test --manifest-path enterprise/Cargo.toml --workspace
