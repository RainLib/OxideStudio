# Replace the example selectors and external HTTPS rule with the CNI-specific
# identities/FQDN policy used by the production cluster before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oxide-control-plane-default-deny
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: oxide-control-plane } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: oxide-enterprise }
      ports: [{ protocol: TCP, port: 8787 }]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: oxide-enterprise-postgres }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oxide-admin-web-default-deny
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: oxide-enterprise-admin-web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8080 }]
  # The static web server makes no network calls. Casdoor and control-plane
  # requests originate in the administrator's browser.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oxide-gateway-default-deny
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: oxide-enterprise-gateway } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8790 }]
  egress:
    # Replace this broad reference rule with selectors/CIDRs for the actual
    # managed database targets. Keep only the ports required by registered
    # sources; each connection is still ticket- and target-binding scoped.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 3306 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 6380 }
        - { protocol: TCP, port: 9200 }
        - { protocol: TCP, port: 27017 }
